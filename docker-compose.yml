# vision-tagger — stack IA para Coolify (plan TAGS Y GALERIA, fase 1)
#
# Servicios:
#   ollama  → modelos qwen2.5vl:3b (visión) + qwen2.5:3b-instruct (chat/ChatLocal)
#   tagger  → tagea fotos del bucket ActivadoresApp → tabla foto_tags
#
# Coolify: crear app "Docker Compose" apuntando a este directorio
# (tools/vision-tagger). Ollama y el tagger comparten la red interna;
# el puerto 11434 NO se publica — solo se expone via dominio Coolify +
# Cloudflare Access (ver README).
services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    # Los modelos se bajan una sola vez (post-deploy, ver README §2)
    volumes:
      - ollama_data:/root/.ollama
    environment:
      # Descarga el modelo de RAM a los 2 min sin uso → en reposo el
      # contenedor queda casi sin consumo (se "despierta" solo ante el
      # primer request de chat o tagger)
      OLLAMA_KEEP_ALIVE: '2m'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_NUM_PARALLEL: '1'
    # Sin puertos ni dominio: ollama SOLO es accesible desde la red interna.
    # El chat llega vía reverse_proxy del servicio chatfront (borra el requisito
    # de publicar 11434 en cualquier lado, ni tailnet ni Cloudflare Access).
    cpus: '3'
    mem_limit: 5g
    networks:
      - ia

  chatfront:
    build: ./chatfront
    restart: unless-stopped
    depends_on:
      - ollama
    environment:
      # Login del chat (basic_auth de Caddy): clave NUNCA en el repo,
      # va como env en Coolify (CHAT_PASS_HASH) en formato bcrypt.
      CHAT_USER: ${CHAT_USER:-matiastx85}
      CHAT_PASS_HASH: ${CHAT_PASS_HASH}
      CHAT_PORT: '3000'
    cpus: '0.25'
    mem_limit: 64m
    networks:
      - ia
      - coolify
    build: .
    restart: unless-stopped
    depends_on:
      - ollama
    environment:
      INSFORGE_URL: ${INSFORGE_URL}
      INSFORGE_API_KEY: ${INSFORGE_API_KEY}
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: qwen2.5vl:3b
      MARCAS_PROPIAS: ${MARCAS_PROPIAS:-CANCILLER,DILEMA,ESTANCIA MENDOZA,FINCA MAGNOLIA,TORO,NATIVO,LOS HELECHOS}
      WATCH_INTERVAL_MIN: '30'
      BATCH_START_HOUR: '2'
      TZ: America/Argentina/Cordoba
    cpus: '1'
    mem_limit: 256m
    networks:
      - ia

volumes:
  ollama_data:

networks:
  ia:
    driver: bridge
  # Traefik de Coolify vive acá — chatfront se une para poder ser proxeado
  coolify:
    external: true

