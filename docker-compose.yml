# vision-tagger — stack IA para Coolify (plan TAGS Y GALERIA, fase 1)
#
# Servicios:
#   ollama    → modelos qwen2.5vl:3b (visión) + qwen2.5:3b-instruct (chat)
#               SOLO red interna. El chat llega por el proxy del chatfront.
#   chatfront → Caddy con basic_auth (CHAT_USER / CHAT_PASS_HASH_B64 en env)
#               sirve el SPA y proxea /api/* → ollama interno
#   tagger    → tagea fotos del bucket ActivadoresApp → tabla foto_tags

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    # Los modelos se bajan una sola vez (post-deploy, ver README §2)
    volumes:
      - ollama_data:/root/.ollama
    environment:
      # Descarga el modelo de RAM a los 2 min sin uso → en reposo el
      # contenedor queda casi sin consumo (se "despierta" solo ante el
      # primer request de chat o tagger)
      OLLAMA_KEEP_ALIVE: '2m'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_NUM_PARALLEL: '1'
    # Sin puertos ni dominio: ollama SOLO es accesible desde la red interna.
    cpus: '3'
    mem_limit: 5g
    networks:
      - ia

  chatfront:
    build: ./chatfront
    restart: unless-stopped
    depends_on:
      - ollama
    environment:
      # Login del chat (basic_auth de Caddy): clave NUNCA en el repo.
      # CHAT_PASS_HASH_B64 = hash bcrypt en base64 (el $401 de bcrypt rompe
      # la interpolación de docker-compose si va plano en env).
      CHAT_USER: ${CHAT_USER:-matiastx85}
      CHAT_PASS_HASH_B64: ${CHAT_PASS_HASH_B64}
    cpus: '0.25'
    mem_limit: 64m
    networks:
      - ia
      - coolify

  tagger:
    build: .
    restart: unless-stopped
    depends_on:
      - ollama
    environment:
      INSFORGE_URL: ${INSFORGE_URL}
      INSFORGE_API_KEY: ${INSFORGE_API_KEY}
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: qwen2.5vl:3b
      MARCAS_PROPIAS: ${MARCAS_PROPIAS:-CANCILLER,DILEMA,ESTANCIA MENDOZA,FINCA MAGNOLIA,TORO,NATIVO,LOS HELECHOS}
      WATCH_INTERVAL_MIN: '30'
      BATCH_START_HOUR: '2'
      TZ: America/Argentina/Cordoba
    cpus: '1'
    mem_limit: 256m
    networks:
      - ia

volumes:
  ollama_data:

networks:
  ia:
    driver: bridge
  # Traefik de Coolify vive acá — chatfront se une para poder ser proxeado
  coolify:
    external: true
